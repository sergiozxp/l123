limit_conn_zone $binary_remote_addr zone=l123_per_ip:10m;
limit_req_zone $binary_remote_addr zone=l123_rate:10m rate=10r/s;

location = /l123 {
    return 301 /l123/;
}

location ^~ /l123/ {
    limit_conn l123_per_ip 2;
    limit_req zone=l123_rate burst=30 nodelay;
    proxy_pass http://127.0.0.1:8125;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $scheme://$host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3660s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}
